name: travel_os
description: A premium, modern travel-first OS mobile app MVP built with Flutter.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^10.1.2

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Network & Cache
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI & Design System
  google_fonts: ^6.1.0
  intl: ^0.19.0
  url_launcher: ^6.2.4
  flutter_web_auth_2: ^4.1.0
  google_sign_in: ^6.2.2
  google_maps_flutter: ^2.9.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
